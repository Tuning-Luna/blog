name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 每天刷新 GitHub 信息快照并重新部署。
    # UTC 16:23 = 北京时间次日 00:23，避开整点 cron 拥堵。
    - cron: '23 16 * * *'
  workflow_dispatch:

# 权限：可写内容（数据刷新步骤要提交快照）+ 写入 Pages + OIDC（deploy-pages 需要）。
permissions:
  contents: write
  pages: write
  id-token: write

# 同一组只允许一个部署在跑，新 push 取消旧的。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 每次触发（push / schedule / dispatch）都先刷新 GitHub 信息快照并提交（若变化）。
      # 失败只告警，用已提交的快照继续构建，避免任务失败。GITHUB_TOKEN 的提交
      # 不会再次触发 workflow，故无死循环；[skip ci] 防止 PAT 场景下的自触发。
      - name: Refresh GitHub info snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run github:info || echo '::warning::github info refresh failed; deploying with the committed snapshot'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- docs/.vitepress/data/github-info.json; then
            echo 'github info snapshot unchanged — nothing to commit'
          else
            git add docs/.vitepress/data/github-info.json
            git commit -m 'chore(data): refresh GitHub info snapshot [skip ci]'
            git push || echo '::warning::snapshot commit not pushed (a newer commit likely landed); building with the refreshed working tree anyway'
          fi

      - name: Build
        run: npm run build
        env:
          # 项目页 base 为 /<repo>/；用户页（<user>.github.io）会被 config.ts 归一化为 /。
          BASE_URL: /${{ github.event.repository.name }}/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
