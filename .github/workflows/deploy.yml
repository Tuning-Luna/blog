name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 权限：只读仓库内容，写入 Pages，请求 OIDC token（deploy-pages 需要）。
permissions:
  contents: read
  pages: write
  id-token: write

# 同一组只允许一个部署在跑，新 push 取消旧的。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # 项目页 base 为 /<repo>/；用户页（<user>.github.io）会被 config.ts 归一化为 /。
          BASE_URL: /${{ github.event.repository.name }}/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
