name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 权限：只读仓库内容，写入 Pages，请求 OIDC token（deploy-pages 需要）。
permissions:
  contents: read
  pages: write
  id-token: write

# 同一组只允许一个部署在跑，新 push 取消旧的。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # config.ts 开了 lastUpdated: true，VitePress 会为每个页面跑 `git log -1`
          # 取最后修改时间。默认的浅克隆（fetch-depth: 1）只有 tip 一个提交，
          # 取不到文件真实历史 —— 线上「更新于」会显示成 CI 克隆时间（所有文章同一天），
          # sitemap 的 <lastmod> 一并失真。官方 VitePress 部署模板同样用 fetch-depth: 0。
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Vite 用 esbuild 剥离类型但**不做类型检查**，所以类型错误不会阻断 build、
      # 会静默上线。这里显式跑 vue-tsc 作为门禁（CLAUDE.md 也要求提交前跑它）。
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # 项目页 base 为 /<repo>/；用户页（<user>.github.io）会被 config.ts 归一化为 /。
          BASE_URL: /${{ github.event.repository.name }}/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
